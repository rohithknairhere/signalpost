[project]
name = "signalpost-agent"
version = "1.0.0"
description = "Evidence-backed research agent for Norwegian companies (Builderr Signalpost)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4==4.13.4",
  "lxml==6.0.0",
]

[project.scripts]
signalpost = "signalpost_agent.cli:main"

[dependency-groups]
dev = ["pytest==8.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signalpost_agent"]
